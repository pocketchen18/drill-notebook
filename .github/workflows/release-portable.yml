name: Build portable pre-release

# 用途：在 GitHub 云端 Windows 环境编译「绿色便携版」，并发布为 Pre-release。
# 两种触发方式：
#   1) 打标签推送：git tag v0.6.1 && git push origin v0.6.1  → 自动编译并发布 v0.6.1 预发行版
#   2) 网页手动触发（Actions → Run workflow）：填版本号，默认仅上传产物自测（勾选 publish_release 开关后也可发布）
# 产物：Drill-Notebook-<版本>-win-x64-portable.zip（解压即用的绿色文件夹版，data/logs/runtime 固定在解压目录）。
# 构建步骤与 scripts/package-portable.ps1 + docs/jlink.md 保持一致。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '预发行版本号（含 v 前缀），例如 v0.6.1'
        required: true
        default: 'v0.6.1'
      publish_release:
        description: '是否发布为 GitHub Pre-release（关闭则仅上传构建产物）'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

# 同一时间只跑一个发布任务，避免并发写 Release
concurrency:
  group: release-portable
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: 打包 Windows 绿色便携版
    runs-on: windows-latest
    # 统一使用 PowerShell 7（与 AGENTS.md 约定一致，避免 5.1 的 GBK 编码问题）
    defaults:
      run:
        shell: pwsh
    env:
      # 无代码签名证书：关闭 electron-builder 的自动签名探测，避免打包中断
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 准备 JDK 17（编译后端 + jlink 内嵌 JRE）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 解析版本号
        id: ver
        env:
          # 手动触发用输入值；标签推送用 tag 名（如 v0.6.1）
          RAW: ${{ inputs.version || github.ref_name }}
        run: |
          $tag = $env:RAW
          $ver = ($tag -replace '^v', '')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "发布标签：$tag  版本号：$ver"

      - name: 安装依赖（含 frontend workspace 与 electron-builder）
        run: npm install

      - name: 生成内嵌 JRE（docs/jlink.md 的模块清单）
        run: >
          jlink
          --add-modules java.base,java.net.http,java.sql,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.management,jdk.unsupported
          --strip-debug --no-header-files --no-man-pages --compress=2
          --output jre

      - name: 构建前端与 Electron 主进程
        run: npm run build

      - name: 构建后端 jar（跳过测试，产物名固定为 drill-notebook-backend-0.1.0.jar）
        run: ./mvnw.cmd -f backend/pom.xml -DskipTests package

      # 目录模式打包：绿色便携以「zip 解压即用」的文件夹分发（data/logs/runtime 固定写在 exe 旁）。
      # 不用单文件 portable——它会自解压到 %TEMP%，数据写进临时目录、退出即丢，且在部分机器上
      # 触发杀软拦截 / 深路径问题导致内置 JRE 起不来（表现为后端 30 秒不健康、只有管理员能启动）。
      - name: 打包便携应用目录（注入版本号，不改 package.json）
        run: npx electron-builder --win dir --publish never --config.extraMetadata.version=${{ steps.ver.outputs.version }}

      - name: 压缩为绿色便携 zip
        run: |
          $exe = 'dist\win-unpacked\Drill Notebook.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'electron-builder 完成但 dist\win-unpacked 下没有 Drill Notebook.exe' }
          $zip = "dist\Drill-Notebook-${{ steps.ver.outputs.version }}-win-x64-portable.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path 'dist\win-unpacked\*' -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "便携包已生成：$zip"

      - name: 校验产物
        run: |
          $zip = @(Get-ChildItem -LiteralPath 'dist' -Filter 'Drill-Notebook-*-win-x64-portable.zip' -File)
          if ($zip.Count -eq 0) { throw '压缩完成但 dist 下没有便携 zip 产物' }
          $zip | ForEach-Object { Write-Host $_.FullName }

      # 标签推送时必发；手动触发时按 publish_release 开关（严格匹配布尔）决定是否发预发行版
      - name: 发布 GitHub Release（预发行版）
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: dist/Drill-Notebook-*-win-x64-portable.zip

      # 手动触发时只上传构建产物，方便先自测流水线
      - name: 上传构建产物（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Drill-Notebook-${{ steps.ver.outputs.version }}-win-x64-portable
          path: dist/Drill-Notebook-*-win-x64-portable.zip
          if-no-files-found: error
