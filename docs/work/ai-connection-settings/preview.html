<div id="dn-ai-review" aria-label="AI 连接设置交互草图">
  <style>
    #dn-ai-review { --dn-canvas: light-dark(#f4f6fa,#131519); --dn-panel: light-dark(#ffffff,#1b1e24); --dn-pane: light-dark(#f6f8fb,#20242b); --dn-text: light-dark(#1e2433,#e2e6ee); --dn-muted: light-dark(#6b7385,#98a2b3); --dn-line: light-dark(#e4e7ee,#2a2f38); --dn-accent: light-dark(#2f54eb,#8da2ff); --dn-fill: light-dark(#2f54eb,#4b6bf0); --dn-on-fill: light-dark(#ffffff,#ffffff); --dn-selected: light-dark(#eef2ff,#1f2a4d); --dn-error: light-dark(#bf2631,#ff9090); --dn-side: 218px; --dn-row: 16px; color: var(--dn-text); font: 14px/1.55 "Segoe UI Variable Text","Segoe UI","Microsoft YaHei",sans-serif; text-align: left; }

    #dn-ai-review .dn-usage { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 5px 14px; padding: 14px 16px; background: var(--dn-panel); border: 1px solid var(--dn-line); border-radius: 9px; margin-bottom: 14px; font-size: 13px; }

    #dn-ai-review .dn-work { display: grid; grid-template-columns: var(--dn-side) minmax(0,1fr); min-height: 490px; background: var(--dn-panel); border: 1px solid var(--dn-line); border-radius: 9px; }
    #dn-ai-review .dn-providers { padding: 16px 10px; background: var(--dn-pane); border-right: 1px solid var(--dn-line); border-radius: 9px 0 0 9px; min-width: 0; }

    #dn-ai-review .dn-model { padding: var(--dn-row) 12px; border-top: 1px solid var(--dn-line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    #dn-ai-review .dn-model-name { border: 0; padding: 0; min-height: 35px; display: grid; justify-content: start; justify-items: start; gap: 3px; text-align: left; background: transparent; flex: 1 1 120px; min-width: 0; }
    #dn-ai-review .dn-model-name strong { font-weight: 600; overflow-wrap: anywhere; }

    #dn-ai-review .dn-model-side button { font-size: 12px; min-height: 30px; }
    #dn-ai-review .dn-tag { padding: 2px 7px; border-radius: 4px; color: var(--dn-accent); background: var(--dn-selected); font-size: 11px; white-space: nowrap; }
    #dn-ai-review .dn-config-tags { font-size: 11px; color: var(--dn-muted); }
    #dn-ai-review .dn-split { display: flex; gap: 0; }
    #dn-ai-review .dn-split button { border-radius: 6px 0 0 6px; }
    #dn-ai-review .dn-split button:last-child { border-left: 0; border-radius: 0 6px 6px 0; padding: 5px; min-width: 27px; }
    #dn-ai-review .dn-inline-menu { flex: 1 1 100%; display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; padding: 6px 0; }
    #dn-ai-review .dn-section { padding: 20px 0; border-bottom: 1px solid var(--dn-line); }
    #dn-ai-review .dn-section:first-child { padding-top: 0; }
    #dn-ai-review .dn-form-grid { display: grid; gap: 14px; margin-top: 16px; }
    #dn-ai-review .dn-field { display: grid; gap: 6px; font-size: 13px; }
    #dn-ai-review .dn-field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    #dn-ai-review .dn-toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 15px 0; }
    #dn-ai-review .dn-toggle-row + .dn-toggle-row { border-top: 1px solid var(--dn-line); }
    #dn-ai-review .dn-toggle-copy { display: grid; gap: 5px; }
    #dn-ai-review .dn-toggle-copy strong { font-size: 13px; font-weight: 600; }
    #dn-ai-review .dn-switch { flex: 0 0 38px; width: 38px; height: 22px; appearance: none; background: var(--dn-muted); border: 1px solid transparent; border-radius: 20px; position: relative; }
    #dn-ai-review .dn-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--dn-panel); transition: transform .15s; }
    #dn-ai-review .dn-switch:checked { background: var(--dn-fill); }
    #dn-ai-review .dn-switch:checked::after { transform: translateX(16px); background: var(--dn-on-fill); }
    #dn-ai-review .dn-advanced { padding-top: 18px; }
    #dn-ai-review .dn-advanced summary { font-size: 13px; }
    #dn-ai-review .dn-actions { justify-content: end; padding-top: 22px; }
    #dn-ai-review .dn-empty { padding: 30px 10px; text-align: center; color: var(--dn-muted); }
    #dn-ai-review .dn-notice { margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: var(--dn-selected); color: var(--dn-accent); font-size: 12px; overflow-wrap: anywhere; }
    #dn-ai-review .dn-error { color: var(--dn-error); font-size: 12px; margin-top: 10px; }
    #dn-ai-review .dn-confirm { background: var(--dn-pane); border: 1px solid var(--dn-line); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
    #dn-ai-review .dn-confirm p { margin-bottom: 12px; }
    #dn-ai-review .dn-confirm .dn-actions { padding: 0; }
    #dn-ai-review .dn-modal-stage { border: 1px solid var(--dn-line); border-radius: 8px; padding: 16px; margin-bottom: 16px; background: var(--dn-pane); }
    #dn-ai-review .dn-pick { display: flex; align-items: center; gap: 8px; padding: 10px 0; overflow-wrap: anywhere; }
    #dn-ai-review .dn-pick input { accent-color: var(--dn-accent); }
    #dn-ai-review .dn-preset-note { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 14px; }
    #dn-ai-review .dn-reasoning-field { display: grid; gap: 7px; max-width: 340px; margin-top: 14px; }
    #dn-ai-review .dn-level-picker { position: relative; min-width: 0; }
    #dn-ai-review .dn-level-trigger { width: 100%; justify-content: space-between; text-align: left; }
    #dn-ai-review .dn-level-trigger > span:first-child { min-width: 0; overflow-wrap: anywhere; }
    #dn-ai-review .dn-level-popup { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; width: 100%; display: flex; flex-direction: column; border: 1px solid var(--dn-line); border-radius: 9px; background: var(--dn-panel); box-shadow: 0 8px 24px light-dark(#0002,#0007); overflow: hidden; }
    #dn-ai-review .dn-level-popup.dn-above { top: auto; bottom: calc(100% + 6px); }
    #dn-ai-review .dn-level-search { padding: 8px; flex-shrink: 0; }
    #dn-ai-review .dn-level-options { min-height: 36px; overflow-y: auto; padding: 0 5px 5px; }
    #dn-ai-review .dn-level-option { display: flex; align-items: center; gap: 10px; border-radius: 5px; padding: 7px 10px; }
    #dn-ai-review .dn-level-option:hover, #dn-ai-review .dn-level-option:focus-within { background: var(--dn-pane); }
    #dn-ai-review .dn-level-option input { appearance: none; flex: 0 0 17px; width: 17px; height: 17px; display: grid; place-items: center; margin: 0; color: var(--dn-text); }
    #dn-ai-review .dn-level-option input:checked::after { content: '✓'; }
    #dn-ai-review .dn-level-footer { flex-shrink: 0; padding: 9px 8px; border-top: 1px solid var(--dn-line); }
    #dn-ai-review .dn-level-footer label { display: grid; gap: 5px; }
    #dn-ai-review .dn-level-empty { padding: 12px; }
    #dn-ai-review .dn-discovery-copy { display: grid; gap: 4px; flex: 1; }
    @media (max-width: 820px) { #dn-ai-review .dn-content { padding: 16px; } #dn-ai-review .dn-page { padding: 12px; } }
    @container (max-width: 760px) { #dn-ai-review .dn-work { grid-template-columns: minmax(0,1fr); } #dn-ai-review .dn-providers { border-right: 0; border-bottom: 1px solid var(--dn-line); border-radius: 9px 9px 0 0; } #dn-ai-review .dn-provider { padding-block: 8px; } }
    @media (max-width: 670px) { #dn-ai-review .dn-body { grid-template-columns: minmax(0,1fr); } #dn-ai-review .dn-rail { display: none; } #dn-ai-review .dn-usage { grid-template-columns: 1fr; gap: 2px; } #dn-ai-review .dn-usage-label { padding-top: 0; } }
    @media (max-width: 430px) { #dn-ai-review .dn-field-pair { grid-template-columns: 1fr; } #dn-ai-review .dn-chrome { padding-right: 98px; font-size: 12px; } #dn-ai-review .dn-tabs { gap: 3px; } #dn-ai-review .dn-tabs span { padding: 5px 6px; font-size: 12px; } #dn-ai-review .dn-content { padding: 12px; } #dn-ai-review .dn-model-side { justify-content: start; } #dn-ai-review .dn-model-name { flex-basis: 100%; } }
    @media (pointer: coarse) { #dn-ai-review button { min-height: 44px; } #dn-ai-review input:not([type=checkbox]), #dn-ai-review select { font-size: 16px; } #dn-ai-review .dn-model-side button { min-height: 44px; } }
    @media (prefers-reduced-motion: reduce) { #dn-ai-review .dn-switch::after { transition: none; } }
  </style>
  <div class="dn-window">
    <div class="dn-chrome"><i data-lucide="notebook-pen" aria-hidden="true"></i><strong>Drill Notebook</strong><span class="dn-muted">/ 设置</span><span class="dn-muted">交互草图 · 示例数据</span></div>
    <div class="dn-body">
      <aside class="dn-rail" aria-label="应用导航示意"><span><i data-lucide="library" aria-hidden="true"></i>题库</span><span><i data-lucide="notebook" aria-hidden="true"></i>笔记</span><span><i data-lucide="calendar-days" aria-hidden="true"></i>复习</span><span><i data-lucide="settings" aria-hidden="true"></i>设置</span></aside>
      <div class="dn-page">
        <div class="dn-tabs" aria-label="设置分区示意"><span>常规</span><span class="dn-current">AI 连接</span><span>记忆</span><span>嵌入与检索</span><span>学习与复习</span><span>数据管理</span></div>
        <div class="dn-usage" id="dn-usage"></div>
        <div class="dn-work">
          <aside class="dn-providers" aria-label="供应商">
            <div class="dn-side-title">供应商</div>
            <input id="dn-provider-search" aria-label="搜索供应商" placeholder="搜索供应商">
            <div id="dn-providers"></div>
            <button type="button" class="dn-add-provider cursor-interaction" data-action="add-provider"><i data-lucide="plus" aria-hidden="true"></i>添加供应商</button>
          </aside>
          <main class="dn-content" id="dn-main" aria-label="供应商详情"></main>
        </div>
        <div id="dn-status" class="dn-notice" role="status" aria-live="polite" hidden></div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const root = document.getElementById('dn-ai-review');
      const main = root.querySelector('#dn-main');
      const providerList = root.querySelector('#dn-providers');
      const status = root.querySelector('#dn-status');
      const effortOrder = ['none','minimal','low','medium','high','xhigh','max'];
      const presets = {
        'study-reasoner': { name: '深度分析', context: '131072', output: '16384', levels: ['low','medium','high','xhigh','max'] },
        'quick-reader': { name: '快速阅读', context: '65536', output: '8192', levels: ['low','medium','high'] }
      };
      const makeModel = (id, name, group, streaming = true, tools = false) => {
        const preset = presets[id];
        return { id, name: name || preset?.name || id, group, streaming, tools, context: preset?.context ?? '', input: '', output: preset?.output ?? '',
          levels: [...(preset?.levels ?? [])], defaultEffort: '', control: 'effort', thinkingBudget: '', preset: preset ? id : '' };
      };
      const providers = [
        { id: 'study', name: '学习网关', format: 'OpenAI Chat Completions', url: 'https://study.example.invalid/v1', models: [makeModel('study-chat','通用对话','常用',true,true), makeModel('study-reasoner','深度分析','常用')] },
        { id: 'backup', name: '备用网关', format: 'Anthropic Messages', url: 'https://backup.example.invalid', models: [makeModel('backup-chat','备用对话','常用'), makeModel('long-reader','长文阅读','阅读')] },
        { id: 'local', name: '本地服务', format: 'OpenAI Chat Completions', url: 'http://127.0.0.1:1234/v1', models: [] }
      ];
      let selected = 'study', applied = ['study','study-chat'], imported = null, editing = null, original = '', query = '', activeMenu = '', pending = null, connection = null;
      let effortSearch = '', publishedState = '';
      const design = { sidebar: 218, compact: false };
      const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const current = () => providers.find(p => p.id === selected);
      const modelName = (p, id) => { const m = p.models.find(m => m.id === id); return m ? m.name || m.id : '未设置'; };
      const bindingName = binding => { const p = binding && providers.find(p => p.id === binding[0]); return p ? `${p.name} / ${modelName(p,binding[1])}` : '未设置'; };
      const same = (binding,p,id) => Boolean(binding && binding[0] === p && binding[1] === id);
      const dirty = () => Boolean(editing && JSON.stringify(editing) !== original);
      const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
      const button = (label, action, extra = '', cls = '') => `<button type="button" class="cursor-interaction ${cls}" data-action="${action}" ${extra}>${label}</button>`;
      function icons() { if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } }); }
      function say(message) { status.hidden = false; status.textContent = message; }
      function persist() {
        if (!globalThis.openai?.setWidgetState) return;
        const state = { modelContent: { main: bindingName(applied), import: imported ? bindingName(imported) : '跟随主模型', openPage: editing ? '模型设置' : '模型列表', reasoning: editing ? { model: editing.id, levels: editing.levels, defaultLevel: editing.defaultEffort || '自动（服务默认）' } : null }, privateContent: { selected, applied, imported, draft: editing, original, effortSearch } };
        publishedState = JSON.stringify(state);
        globalThis.openai.setWidgetState(state).catch(() => {});
      }
      function restore(saved) {
        const state = saved?.privateContent;
        const valid = b => Array.isArray(b) && providers.some(p => p.id === b[0] && p.models.some(m => m.id === b[1]));
        if (!state) return;
        if (providers.some(p => p.id === state.selected)) selected = state.selected;
        if (valid(state.applied)) applied = state.applied;
        imported = valid(state.imported) ? state.imported : null;
        if (state.draft && Array.isArray(state.draft.levels) && typeof state.original === 'string' && (state.draft.isNew || current().models.some(m => m.id === state.draft.id))) {
          editing = { ...state.draft, levels: effortOrder.filter(level => state.draft.levels.includes(level)) };
          if (!editing.levels.includes(editing.defaultEffort)) editing.defaultEffort = '';
          original = state.original;
          effortSearch = typeof state.effortSearch === 'string' ? state.effortSearch : '';
        }
      }
      function renderTop() {
        root.querySelector('#dn-usage').innerHTML = `<div class="dn-usage-label">当前使用</div><div><div class="dn-usage-line"><span>主模型</span>${button(esc(bindingName(applied)),'locate-main','','dn-link')}</div><div class="dn-usage-line"><span class="dn-muted">导入兜底</span>${imported ? button(esc(bindingName(imported)),'locate-import','','dn-link') + button('恢复跟随','follow','','dn-link') : '<span>跟随主模型</span>'}</div></div>`;
        const filter = root.querySelector('#dn-provider-search').value.trim().toLowerCase();
        providerList.innerHTML = providers.filter(p => `${p.name} ${p.url}`.toLowerCase().includes(filter)).map(p => `<button type="button" class="dn-provider cursor-interaction" data-action="select-provider" data-provider="${p.id}" aria-pressed="${p.id === selected}"><span class="dn-provider-info"><span class="dn-provider-name">${esc(p.name)}</span><span class="dn-muted">${p.models.length} 个模型</span></span><span>${applied?.[0] === p.id ? '<span class="dn-tag">主</span>' : ''}${imported?.[0] === p.id ? '<span class="dn-tag">导入</span>' : ''}</span></button>`).join('') || '<p class="dn-muted">没有匹配的供应商</p>';
      }
      function modelRows() {
        const p = current();
        const matches = p.models.filter(m => `${m.name} ${m.id} ${m.group}`.toLowerCase().includes(query.toLowerCase()));
        if (!matches.length) return `<div class="dn-empty">${p.models.length ? '没有匹配的模型' : '添加模型，或从供应商获取'}</div>`;
        const groups = [...new Set(matches.map(m => m.group || '未分组'))].sort((a,b) => a === '未分组' ? 1 : b === '未分组' ? -1 : a.localeCompare(b,'zh'));
        return groups.map(g => `<details class="dn-group" open><summary class="cursor-interaction">${esc(g)} · ${matches.filter(m => (m.group || '未分组') === g).length}</summary>${matches.filter(m => (m.group || '未分组') === g).map(m => {

        if (action === 'add-discovered') { const picked = [...main.querySelectorAll('input[name=discovery]:checked')]; for (const choice of picked) current().models.push(makeModel(choice.value,'','')); render(); say(`已添加 ${picked.length} 个示例模型，命中预设的资料已自动填入。`); }
        if (action === 'test') {
          main.querySelector('.dn-modal-stage')?.remove();
          main.insertAdjacentHTML('afterbegin',`<section class="dn-modal-stage"><div class="dn-row"><h3>测试连接 · ${esc(modelName(current(),id))}</h3>${button('关闭','close-stage')}</div><label class="dn-field" style="margin-top:12px">测试提示词<input value="你好，请回复 pong。"></label><p class="dn-muted">草图仅展示结果，不发送请求或产生用量。</p><div class="dn-actions">${button('演示通过','test-result','','dn-primary')}${button('演示失败','test-fail')}</div></section>`);
        }
        if (action === 'test-result') say('示例测试通过 · 820ms · pong。基础请求可用不代表工具能力已验证。');
        if (action === 'test-fail') say('示例测试失败 · 认证失败，请检查此供应商的密钥或权限。当前主模型保持不变。');
        if (action === 'delete-model') {
          if (same(applied,selected,id) || same(imported,selected,id)) say('此模型仍被使用，请先应用其他模型，或恢复导入跟随。');
          else { main.querySelector('.dn-modal-stage')?.remove(); main.insertAdjacentHTML('afterbegin',`<section class="dn-modal-stage"><h3>删除模型 ${esc(modelName(current(),id))}？</h3><div class="dn-actions">${button('取消','close-stage')}${button('确认删除','confirm-delete',`data-id="${esc(id)}"`)}</div></section>`); }
        }
        if (action === 'confirm-delete') { current().models = current().models.filter(m => m.id !== id); activeMenu = ''; render(); say('示例模型已删除。'); }
        if (action === 'provider-more') {
          const menu = main.querySelector('.dn-provider-menu');
          if (menu) { menu.remove(); el.setAttribute('aria-expanded', 'false'); }
          else { el.setAttribute('aria-expanded', 'true'); el.parentElement.insertAdjacentHTML('beforeend', `<div class="dn-provider-menu" role="menu" aria-label="供应商操作">${button('编辑连接','edit-connection','role="menuitem"')}${button('删除供应商','delete-provider','role="menuitem"')}</div>`); }
        }
        if (action === 'delete-provider') {
          main.querySelector('.dn-provider-menu')?.remove();
          main.querySelector('[data-action="provider-more"]')?.setAttribute('aria-expanded', 'false');
          if (applied?.[0] === selected || imported?.[0] === selected) say('此供应商仍被使用，请先切换主模型或导入兜底。');
          else { main.querySelector('.dn-modal-stage')?.remove(); main.insertAdjacentHTML('afterbegin', `<section class="dn-modal-stage"><h3>删除 ${esc(current().name)}？</h3><p class="dn-muted">将移除连接、示例密钥和 ${current().models.length} 个模型。</p><div class="dn-actions">${button('取消','close-stage')}${button('确认删除','confirm-delete-provider')}</div></section>`); }
        }
        if (action === 'confirm-delete-provider') { providers.splice(providers.findIndex(p => p.id === selected),1); select(applied[0]); say('示例供应商已删除。'); }
        icons();
      });
      const savedState = globalThis.openai?.widgetState;
      restore(savedState);
      if (!savedState?.privateContent) {
        const sample = providers[0].models.find(model => model.id === 'study-reasoner');
        editing = { ...sample, levels: [...sample.levels], isNew: false };
        original = JSON.stringify(editing);
      }
      render();
      window.addEventListener('openai:set_globals', event => { const state = event.detail?.globals?.widgetState; if (state && JSON.stringify(state) !== publishedState && !dirty() && !connection) { restore(state); render(); } });
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: () => { root.style.setProperty('--dn-side',`${design.sidebar}px`); root.style.setProperty('--dn-row',design.compact ? '10px' : '16px'); } });
        tweak.addSlider(design,'sidebar',{ label: '供应商栏宽度', min: 190, max: 250, step: 2, unit: 'px' });
        tweak.addToggle(design,'compact',{ label: '紧凑模型行' });
      }
    })();
  </script>
</div>
