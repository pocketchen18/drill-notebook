<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Drill Notebook">
  <!--
    Drill Notebook 品牌标识（母版）。
    同一几何在三处出现：这里（应用图标 / favicon 母版）、frontend/public/favicon.svg（拷贝）、
    frontend/src/components/BrandMark.tsx（侧栏内联）。改图形时三处同步。
    PNG / ICO 由 `npm run build:icons` 从本文件渲染生成。
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cff"/>
      <stop offset="1" stop-color="#2440c4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>
  <!-- 带折角的笔记页 -->
  <path d="M178 108h122l64 64v202a30 30 0 0 1-30 30H178a30 30 0 0 1-30-30V138a30 30 0 0 1 30-30z" fill="#ffffff"/>
  <path d="M300 108v34a30 30 0 0 0 30 30h34z" fill="#c9d6ff"/>
  <!-- 两行笔记 -->
  <rect x="196" y="206" width="120" height="20" rx="10" fill="#2f54eb"/>
  <rect x="196" y="252" width="84" height="20" rx="10" fill="#2f54eb" fill-opacity="0.45"/>
  <!-- 刷题勾选 -->
  <path d="M206 338l38 36 68-80" fill="none" stroke="#2f54eb" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
