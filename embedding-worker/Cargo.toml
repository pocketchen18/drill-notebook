[package]
name = "embedding-worker"
version = "0.1.0"
edition = "2021"
description = "Offline embedding worker using FastEmbed for notebook RAG"

[lib]
name = "embedding_worker"
path = "src/lib.rs"

[[bin]]
name = "embedding-worker"
path = "src/main.rs"

[dependencies]
fastembed = { version = "=5.17.3", default-features = false, features = ["ort-download-binaries-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "fmt"] }

[dev-dependencies]
tempfile = "3"
